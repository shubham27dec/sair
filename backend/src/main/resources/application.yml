spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sair
    username: sair
    password: sair
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:sair-dev-secret-change-in-production-must-be-256-bits-long}
  expiry-ms: 86400000  # 24 hours

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
