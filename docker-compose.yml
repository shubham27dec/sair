services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sair
      POSTGRES_USER: sair
      POSTGRES_PASSWORD: sair
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sair
      SPRING_DATASOURCE_USERNAME: sair
      SPRING_DATASOURCE_PASSWORD: sair
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-sair-dev-secret-change-in-production-must-be-256-bits-long}
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
